<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remal Hotel - Kitchen Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0908;
            --bg-card: rgba(22, 20, 18, 0.92);
            --text-gold: #DCA773;
            --border-gold: rgba(220, 167, 115, 0.35);
            --border-gold-strong: rgba(220, 167, 115, 0.65);
            --text-main: #ffffff;
            --text-muted: #c2bab0;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
        }

        .font-serif-luxury { font-family: 'Cinzel', serif; }
        .remal-card { background: var(--bg-card); backdrop-filter: blur(20px); border: 1px solid var(--border-gold-strong); }
        
        @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .pulse-notification { animation: pulse-red 1.5s infinite; }

        .status-badge {
            padding: 0.3rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid;
        }
    </style>
</head>
<body class="min-h-screen p-3 sm:p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- En-tête -->
        <div class="flex justify-between items-center remal-card p-4 rounded-2xl shadow-lg">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-[var(--text-gold)] text-stone-950 flex items-center justify-center text-xl">
                    <i class="fas fa-utensils"></i>
                </div>
                <div>
                    <h1 class="text-lg font-serif-luxury font-bold text-[var(--text-gold)]">KITCHEN DASHBOARD</h1>
                    <p class="text-[10px] text-muted-custom uppercase">Remal Hotel & Villas • Room Service</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-[10px] text-emerald-400 font-bold flex items-center gap-1">
                    <span class="w-2 h-2 bg-emerald-400 rounded-full pulse-notification"></span>
                    LIVE
                </span>
            </div>
        </div>

        <!-- Statistiques -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="remal-card rounded-2xl p-4 text-center">
                <div class="text-3xl font-serif-luxury font-bold text-[var(--text-gold)]" id="statTotalOrders">0</div>
                <p class="text-[10px] text-muted-custom uppercase mt-1 font-bold">Total</p>
            </div>
            <div class="remal-card rounded-2xl p-4 text-center">
                <div class="text-3xl font-serif-luxury font-bold text-amber-400" id="statPendingOrders">0</div>
                <p class="text-[10px] text-muted-custom uppercase mt-1 font-bold">Pending</p>
            </div>
            <div class="remal-card rounded-2xl p-4 text-center">
                <div class="text-3xl font-serif-luxury font-bold text-blue-400" id="statPreparingOrders">0</div>
                <p class="text-[10px] text-muted-custom uppercase mt-1 font-bold">Preparing</p>
            </div>
            <div class="remal-card rounded-2xl p-4 text-center">
                <div class="text-3xl font-serif-luxury font-bold text-emerald-400" id="statCompletedOrders">0</div>
                <p class="text-[10px] text-muted-custom uppercase mt-1 font-bold">Delivered</p>
            </div>
        </div>

        <!-- Filtres -->
        <div class="flex gap-2 overflow-x-auto" style="scrollbar-width: none;">
            <button onclick="filterStaffOrders('all')" id="filterAll" class="px-4 py-2 rounded-xl bg-[var(--text-gold)] text-stone-950 text-xs font-bold whitespace-nowrap">All</button>
            <button onclick="filterStaffOrders('Pending')" id="filterPending" class="px-4 py-2 rounded-xl remal-card text-muted-custom text-xs font-bold whitespace-nowrap">🕐 Pending</button>
            <button onclick="filterStaffOrders('Preparing')" id="filterPreparing" class="px-4 py-2 rounded-xl remal-card text-muted-custom text-xs font-bold whitespace-nowrap">👨‍🍳 Preparing</button>
            <button onclick="filterStaffOrders('Ready')" id="filterReady" class="px-4 py-2 rounded-xl remal-card text-muted-custom text-xs font-bold whitespace-nowrap">✅ Ready</button>
            <button onclick="filterStaffOrders('Delivered')" id="filterDelivered" class="px-4 py-2 rounded-xl remal-card text-muted-custom text-xs font-bold whitespace-nowrap">🚚 Delivered</button>
        </div>

        <!-- Commandes -->
        <div id="staffOrdersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jbcewxdvhvusfmlpjldk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpiY2V3eGR2aHZ1c2ZtbHBqbGRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0OTA3NTcsImV4cCI6MjEwNDA2Njc1N30.-AlYlsf5pAOaxNu_hKMUO6sZISM_l5jafcET9CqfLJc';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let staffOrders = [];
        let currentFilter = 'all';

        // Initialisation
        fetchAllOrders();
        setupRealtime();

        async function fetchAllOrders() {
            const { data, error } = await supabaseClient
                .from('food_orders')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(50);

            if (data) {
                staffOrders = data;
                renderStaffOrders();
            }
        }

        function setupRealtime() {
            supabaseClient
                .channel('food-orders-realtime')
                .on('postgres_changes', 
                    { event: '*', schema: 'public', table: 'food_orders' }, 
                    () => { fetchAllOrders(); }
                )
                .subscribe();
        }

        function renderStaffOrders() {
            const container = document.getElementById('staffOrdersContainer');
            const filteredOrders = currentFilter === 'all' 
                ? staffOrders 
                : staffOrders.filter(o => o.status === currentFilter);

            // Statistiques
            document.getElementById('statTotalOrders').innerText = staffOrders.length;
            document.getElementById('statPendingOrders').innerText = staffOrders.filter(o => o.status === 'Pending').length;
            document.getElementById('statPreparingOrders').innerText = staffOrders.filter(o => o.status === 'Preparing' || o.status === 'Ready').length;
            document.getElementById('statCompletedOrders').innerText = staffOrders.filter(o => o.status === 'Delivered' || o.status === 'Completed').length;

            if (filteredOrders.length === 0) {
                container.innerHTML = '<p class="text-center text-muted-custom col-span-full py-8">No orders found</p>';
                return;
            }

            container.innerHTML = filteredOrders.map(order => {
                const statusColors = {
                    'Pending': 'bg-amber-500/20 text-amber-400 border-amber-500/30',
                    'Preparing': 'bg-blue-500/20 text-blue-400 border-blue-500/30',
                    'Ready': 'bg-purple-500/20 text-purple-400 border-purple-500/30',
                    'Delivered': 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30'
                };
                const statusColor = statusColors[order.status] || statusColors['Pending'];
                const timeAgo = getTimeAgo(order.created_at);
                const items = Array.isArray(order.items) ? order.items : [];

                return `
                    <div class="remal-card rounded-2xl p-4 space-y-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="font-bold text-[var(--text-gold)] text-sm">Room ${order.room_number}</p>
                                <p class="text-[10px] text-muted-custom">${order.guest_name} • ${order.meal_type}</p>
                            </div>
                            <span class="status-badge ${statusColor}">${order.status || 'Pending'}</span>
                        </div>
                        
                        <div class="space-y-1 text-xs">
                            ${items.map(item => `<p class="text-[var(--text-main)]">• ${item.quantity}x ${item.name} <span class="text-muted-custom">(AED ${item.total || item.price * item.quantity})</span></p>`).join('')}
                        </div>
                        
                        <div class="flex justify-between items-center text-xs border-t border-[var(--border-gold)] pt-2">
                            <span class="font-bold text-[var(--text-gold)]">AED ${order.total_amount}</span>
                            <span class="text-[10px] text-muted-custom">${timeAgo}</span>
                        </div>
                        
                        ${order.special_instructions && order.special_instructions !== 'None' 
                            ? `<p class="text-[10px] text-amber-400 bg-amber-500/10 p-2 rounded-lg">📝 ${order.special_instructions}</p>`
                            : ''
                        }
                        
                        <p class="text-[10px] text-muted-custom">🕒 ${order.delivery_time}</p>
                        
                        <div class="flex gap-2">
                            ${order.status === 'Pending' 
                                ? `<button onclick="updateOrderStatus(${order.id}, 'Preparing')" class="flex-1 bg-blue-500/20 text-blue-400 py-2 rounded-lg text-xs font-bold hover:bg-blue-500/30 transition">Start Preparing</button>`
                                : order.status === 'Preparing'
                                ? `<button onclick="updateOrderStatus(${order.id}, 'Ready')" class="flex-1 bg-purple-500/20 text-purple-400 py-2 rounded-lg text-xs font-bold hover:bg-purple-500/30 transition">Mark Ready</button>`
                                : order.status === 'Ready'
                                ? `<button onclick="updateOrderStatus(${order.id}, 'Delivered')" class="flex-1 bg-emerald-500/20 text-emerald-400 py-2 rounded-lg text-xs font-bold hover:bg-emerald-500/30 transition">Mark Delivered</button>`
                                : ''
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterStaffOrders(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('[id^="filter"]').forEach(btn => {
                btn.className = 'px-4 py-2 rounded-xl remal-card text-muted-custom text-xs font-bold whitespace-nowrap transition';
            });
            
            const activeBtn = document.getElementById(`filter${filter.charAt(0).toUpperCase() + filter.slice(1)}`);
            if (activeBtn) {
                activeBtn.className = 'px-4 py-2 rounded-xl bg-[var(--text-gold)] text-stone-950 text-xs font-bold whitespace-nowrap transition';
            }
            
            renderStaffOrders();
        }

        async function updateOrderStatus(orderId, newStatus) {
            const { error } = await supabaseClient
                .from('food_orders')
                .update({ status: newStatus })
                .eq('id', orderId);

            if (!error) {
                fetchAllOrders();
            }
        }

        function getTimeAgo(timestamp) {
            const now = new Date();
            const then = new Date(timestamp);
            const diffMins = Math.floor((now - then) / 60000);
            
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins} min ago`;
            const diffHours = Math.floor(diffMins / 60);
            return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
        }
    </script>
</body>
</html>

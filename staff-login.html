<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - Remal Hotel</title>
    
    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Fichiers locaux -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-in-up { animation: fadeInUp 0.5s ease forwards; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .shake-error { animation: shake 0.5s ease; }
    </style>
</head>
<body class="min-h-screen lock-screen flex items-center justify-center p-4 relative">

    <!-- Bouton de basculement de thème -->
    <button onclick="toggleTheme()" class="theme-toggle-btn fixed top-4 right-4 z-50" title="Toggle Dark/Light Mode">
        <i class="fas fa-sun text-sm" id="themeIconLogin"></i>
    </button>

    <div class="w-full max-w-sm lock-card p-8 rounded-[2rem] space-y-6 animate-fade-in-up">
        
        <!-- Logo -->
        <div class="text-center space-y-2">
            <div class="w-16 h-16 mx-auto rounded-full bg-[var(--text-gold)] flex items-center justify-center shadow-2xl">
                <i class="fas fa-lock text-xl text-stone-950"></i>
            </div>
            <h1 class="text-lg font-serif-luxury font-bold text-[var(--text-gold)] tracking-widest">STAFF ACCESS</h1>
            <p class="text-[10px] text-muted-custom">Remal Hotel & Villas • Kitchen Dashboard</p>
        </div>

        <!-- Formulaire -->
        <div class="space-y-3">
            <div>
                <label class="block font-bold text-[var(--text-gold)] uppercase tracking-wider text-[10px] mb-1.5">
                    <i class="fas fa-key mr-1"></i> Staff Password
                </label>
                <input type="password" id="staffPassword" placeholder="Enter staff password" 
                       class="w-full remal-input rounded-xl p-3.5 text-sm text-center font-bold tracking-widest"
                       onkeypress="if(event.key==='Enter') verifyLogin()">
            </div>
            
            <!-- Message d'erreur -->
            <div id="loginErrorMsg" class="hidden text-center text-[10px] text-red-400 font-bold py-1">
                ❌ Invalid password. Please try again.
            </div>
            
            <button onclick="verifyLogin()" 
                    class="w-full bg-[var(--text-gold)] hover:bg-[#ebd0b3] text-stone-950 font-black py-3.5 rounded-xl text-xs uppercase tracking-widest transition-all shadow-lg hover:scale-[1.02] active:scale-[0.98]">
                <i class="fas fa-unlock mr-2"></i> Access Dashboard
            </button>
        </div>

        <!-- Lien retour -->
        <a href="index.html" class="block text-center text-muted-custom hover:text-[var(--text-gold)] text-[10px] font-bold transition">
            <i class="fas fa-arrow-left mr-1"></i> Back to Guest Portal
        </a>

        <div class="text-center text-[8px] text-muted-custom opacity-60 tracking-widest uppercase">
            Remal Hotel & Villas • Digital Systems
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script>
        // ==================== FONCTIONS THÈME ====================
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            
            const isLight = document.body.classList.contains('light-mode');
            const icon = document.getElementById('themeIconLogin');
            
            if (icon) {
                icon.className = isLight ? 'fas fa-moon text-sm' : 'fas fa-sun text-sm';
            }
            
            localStorage.setItem('remal_theme', isLight ? 'light' : 'dark');
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('remal_theme');
            
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
            } else {
                document.body.classList.remove('light-mode');
            }
            
            const isLight = document.body.classList.contains('light-mode');
            const icon = document.getElementById('themeIconLogin');
            
            if (icon) {
                icon.className = isLight ? 'fas fa-moon text-sm' : 'fas fa-sun text-sm';
            }
        }

        // ==================== VÉRIFICATION DU MOT DE PASSE ====================
        function verifyLogin() {
            const password = document.getElementById('staffPassword').value;
            const errorMsg = document.getElementById('loginErrorMsg');
            
            errorMsg.classList.add('hidden');
            
            if (!password) {
                errorMsg.innerText = '⚠️ Please enter password';
                errorMsg.classList.remove('hidden');
                document.getElementById('staffPassword').classList.add('shake-error');
                setTimeout(() => document.getElementById('staffPassword').classList.remove('shake-error'), 500);
                return;
            }
            
            if (password === SUPABASE_CONFIG.staffPassword) {
                sessionStorage.setItem('staff_authorized', 'true');
                sessionStorage.setItem('staff_login_time', new Date().toISOString());
                window.location.href = 'staff.html';
            } else {
                errorMsg.innerText = '❌ Invalid password. Please try again.';
                errorMsg.classList.remove('hidden');
                document.getElementById('staffPassword').classList.add('shake-error');
                document.getElementById('staffPassword').value = '';
                setTimeout(() => document.getElementById('staffPassword').classList.remove('shake-error'), 500);
            }
        }

        // ==================== INITIALISATION ====================
        initTheme();
    </script>
</body>
</html>

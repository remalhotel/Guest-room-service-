<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - Remal Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-stone-950 p-4">
    <div class="w-full max-w-md p-6">
        <div class="bg-stone-900/90 border border-amber-500/30 rounded-3xl p-8 space-y-6 shadow-2xl">
            <div class="text-center space-y-3">
                <div class="w-20 h-20 mx-auto rounded-full bg-[#DCA773] flex items-center justify-center shadow-2xl">
                    <i class="fas fa-concierge-bell text-2xl text-stone-950"></i>
                </div>
                <h1 class="text-xl font-serif-luxury font-bold text-[#DCA773] tracking-[0.2em]">STAFF PORTAL</h1>
                <p class="text-[10px] text-stone-400 uppercase tracking-[0.3em] font-bold">Remal Hotel & Villas</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block font-bold text-[#DCA773] uppercase tracking-wider text-[10px] mb-1.5">
                        <i class="fas fa-user mr-1"></i> Username
                    </label>
                    <input type="text" id="loginUsername" placeholder="admin" class="w-full bg-stone-950 border border-stone-800 rounded-2xl p-4 font-semibold text-sm text-stone-100 outline-none focus:border-amber-500">
                </div>
                
                <div>
                    <label class="block font-bold text-[#DCA773] uppercase tracking-wider text-[10px] mb-1.5">
                        <i class="fas fa-lock mr-1"></i> Password
                    </label>
                    <input type="password" id="loginPassword" placeholder="remal2024" class="w-full bg-stone-950 border border-stone-800 rounded-2xl p-4 font-semibold text-sm text-stone-100 outline-none focus:border-amber-500" onkeypress="if(event.key==='Enter') handleLogin()">
                </div>
                
                <button onclick="handleLogin()" class="w-full bg-[#DCA773] hover:bg-[#ebd0b3] text-stone-950 font-black py-4 rounded-2xl text-xs uppercase tracking-widest transition-all">
                    <i class="fas fa-sign-in-alt mr-1"></i> Login
                </button>
            </div>
            
            <p class="text-center text-[8px] text-stone-500">Authorized personnel only</p>
        </div>
    </div>

    <script>
        function handleLogin() {
    const username = document.getElementById('loginUsername').value.trim().toLowerCase();
    const password = document.getElementById('loginPassword').value.trim();
    
    const credentials = {
        'admin': { password: 'remal2024', role: 'admin', name: 'Administrator' },
        'frontdesk': { password: 'front2024', role: 'front_desk', name: 'Front Desk' },
        'fnb': { password: 'fnb2024', role: 'food_beverage', name: 'F&B Staff' },
        'housekeeping': { password: 'house2024', role: 'housekeeping', name: 'Housekeeping' },
        'maintenance': { password: 'maint2024', role: 'maintenance', name: 'Maintenance' }
    };
    
    const staff = credentials[username];
    
    if (staff && staff.password === password) {
        sessionStorage.setItem('staff_authorized', 'true');
        sessionStorage.setItem('staff_login_time', new Date().toISOString());
        sessionStorage.setItem('staff_user', JSON.stringify({ username, name: staff.name, role: staff.role }));
        window.location.href = 'staff-dashboard.html';
    } else {
        alert('Invalid username or password');
    }
}
        
        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('staff_authorized')) {
                window.location.href = 'staff-dashboard.html';
            }
        });
    </script>
</body>
</html>

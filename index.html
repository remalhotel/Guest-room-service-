<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remal Hotel & Villas - Room Service</title>
    
    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Fichiers locaux -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="min-h-screen p-3 sm:p-6 flex items-center justify-center pb-24">

    <div class="w-full max-w-md remal-card p-6 sm:p-8 rounded-[2rem] space-y-6">
        
        <!-- Bannière -->
        <div class="relative text-center border border-[var(--border-gold-strong)] pb-6 pt-7 rounded-2xl overflow-hidden">
            <div class="relative z-10 space-y-1.5">
                <h1 class="text-3xl font-serif-luxury font-bold text-gold-gradient tracking-[0.25em]">REMAL</h1>
                <p class="text-[10px] text-[var(--text-main)] tracking-[0.2em] font-bold uppercase">Hotel & Villas • Al Dhannah City</p>
                <div class="pt-2">
                    <span class="inline-block text-[9px] bg-[var(--bg-card)] text-[var(--text-gold)] border border-[var(--border-gold-strong)] font-extrabold px-4 py-1.5 rounded-full uppercase tracking-[0.15em]">
                        🍽️ In-Room Dining & Room Service
                    </span>
                </div>
            </div>
        </div>

        <!-- Formulaire -->
        <div class="space-y-4 text-xs">
            
            <!-- Numéro de chambre -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block font-bold text-[var(--text-gold)] uppercase tracking-wider text-[10px]">Room Number *</label>
                    <button onclick="changerDeChambre()" id="btnChangeRoom" class="hidden text-[10px] text-[var(--text-gold)] hover:underline font-bold uppercase">Change</button>
                </div>
                <input type="text" id="guestRoomInput" oninput="onRoomNumberTyped(this.value)" placeholder="e.g., 103" class="w-full remal-input rounded-2xl p-4 font-bold text-xl text-[var(--text-gold)]">
            </div>

            <!-- Vérification -->
            <div id="guestVerificationBox" class="hidden p-4 bg-[var(--bg-card-hover)] border border-[var(--border-gold-strong)] rounded-2xl space-y-2.5 animate-fade-in">
                <label class="block font-bold text-[var(--text-gold)] text-[10px] uppercase tracking-wider">Identity Verification *</label>
                <p class="text-[10px] text-muted-custom">Enter any name on your reservation.</p>
                <div class="flex gap-2">
                    <input type="text" id="guestNameInput" placeholder="e.g., Sangare or Zidane" class="flex-1 remal-input rounded-xl p-3 font-semibold text-xs">
                    <button onclick="verifierNomClient()" class="bg-[#DCA773] text-stone-950 font-black px-4 rounded-xl text-xs uppercase hover:scale-105 transition">Verify</button>
                </div>
            </div>

            <!-- Client confirmé -->
            <div id="roomInfoBox" class="hidden p-4 bg-[var(--bg-card-hover)] border border-[var(--border-gold-strong)] rounded-2xl space-y-2 animate-fade-in">
                <div class="flex justify-between font-semibold">
                    <span class="text-muted-custom text-[11px]">Guest Name:</span> 
                    <span id="displayGuestName" class="text-[var(--text-gold)] font-bold">---</span>
                </div>
            </div>

            <!-- Période de repas -->
            <div>
                <label class="block font-bold text-[var(--text-gold)] mb-1.5 uppercase tracking-wider text-[10px]">Meal Period</label>
                <select id="guestMealType" class="w-full remal-input rounded-2xl p-3.5 font-bold cursor-pointer text-xs">
                    <option value="Breakfast">🌅 Breakfast (6:00 - 11:00)</option>
                    <option value="Lunch">☀️ Lunch (12:00 - 15:00)</option>
                    <option value="Dinner">🌙 Dinner (18:00 - 23:00)</option>
                    <option value="All Day">🕐 All Day Dining</option>
                    <option value="Late Night">🌃 Late Night (23:00 - 6:00)</option>
                </select>
            </div>

            <!-- Bouton menu -->
            <div>
                <button onclick="openMenuModal()" class="w-full bg-[var(--bg-card-hover)] hover:border-[var(--text-gold)] text-[var(--text-gold)] border border-[var(--border-gold-strong)] font-bold py-4 px-4 rounded-2xl transition flex items-center justify-between shadow-md">
                    <span class="flex items-center gap-3">
                        <i class="fas fa-utensils"></i> Browse Menu & Select Items
                    </span>
                    <span id="selectedBadgeCount" class="bg-[var(--text-gold)] text-stone-950 px-3.5 py-1 rounded-full text-[11px] font-black">0 items</span>
                </button>
            </div>

            <!-- Instructions -->
            <div>
                <label class="block font-bold text-[var(--text-gold)] mb-1.5 uppercase tracking-wider text-[10px]">Special Instructions / Allergies</label>
                <textarea id="guestSpecialInstructions" placeholder="e.g., No onions, gluten allergy, extra spicy..." class="w-full h-20 remal-input rounded-2xl p-3.5 outline-none resize-none text-xs"></textarea>
            </div>

            <!-- Temps de livraison -->
            <div>
                <label class="block font-bold text-[var(--text-gold)] mb-1.5 uppercase tracking-wider text-[10px]">Delivery Time</label>
                <select id="deliveryTime" class="w-full remal-input rounded-2xl p-3.5 font-bold cursor-pointer text-xs">
                    <option value="As soon as possible">⚡ As soon as possible (~30 min)</option>
                    <option value="In 45 minutes">🕒 In 45 minutes</option>
                    <option value="In 1 hour">🕒 In 1 hour</option>
                </select>
            </div>

            <!-- Boutons -->
            <div class="space-y-3 pt-2">
                <button onclick="submitOrder('direct')" class="w-full bg-[#DCA773] hover:bg-[#ebd0b3] text-stone-950 font-black py-4 rounded-2xl text-xs uppercase tracking-widest transition-all flex items-center justify-center gap-2.5 shadow-lg">
                    <i class="fas fa-concierge-bell"></i> Direct Order to Kitchen
                </button>
                <button onclick="submitOrder('whatsapp')" class="w-full bg-[#10b981] hover:bg-[#34d399] text-stone-950 font-black py-3.5 rounded-2xl text-xs uppercase tracking-widest transition-all flex items-center justify-center gap-2.5 shadow-lg">
                    <i class="fab fa-whatsapp text-lg"></i> Send via WhatsApp
                </button>
            </div>
        </div>

        <div class="text-center text-[9px] text-muted-custom pt-3 border-t border-[var(--border-gold)] tracking-widest uppercase opacity-90 font-semibold">
            Remal Hotel & Villas Digital Systems
        </div>
    </div>

    <!-- Modale Menu -->
    <div id="menuModal" class="hidden fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-4">
        <div class="bg-[var(--bg-card)] border border-[var(--border-gold-strong)] w-full max-w-lg rounded-3xl p-6 space-y-4 max-h-[90vh] flex flex-col">
            
            <div class="flex justify-between items-center border-b border-[var(--border-gold)] pb-3">
                <h3 class="text-xs font-serif-luxury font-bold text-[var(--text-gold)] uppercase tracking-widest">
                    <i class="fas fa-book-open"></i> Restaurant Menu
                </h3>
                <button onclick="closeMenuModal()" class="text-muted-custom hover:text-[var(--text-main)] text-xl">✕</button>
            </div>

            <div class="relative">
                <i class="fas fa-search absolute left-3.5 top-3 text-muted-custom text-xs"></i>
                <input type="text" id="menuSearchInput" oninput="renderMenuItems()" placeholder="Search dish..." class="w-full remal-input rounded-xl pl-9 pr-3 py-2 text-xs">
            </div>

            <div id="menuItemsContainer" class="flex-1 overflow-y-auto pr-1 space-y-3 scrollbar-none"></div>

            <div class="border-t border-[var(--border-gold)] pt-3 space-y-3">
                <div class="flex justify-between items-center text-xs font-bold">
                    <span class="text-muted-custom">Total:</span>
                    <span id="modalMenuTotalSummary" class="text-[var(--text-gold)] font-serif-luxury text-sm">0 items · 0.00 AED</span>
                </div>
                <button onclick="confirmMenuSelection()" class="w-full bg-[var(--text-gold)] text-stone-950 font-bold py-3.5 rounded-2xl text-xs uppercase tracking-widest">
                    Confirm Selection
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/menu.js"></script>
    <script>
        // Initialisation Supabase
        const supabaseClient = initSupabaseClient();
        let menuCart = {};

        // Fonctions menu
        function openMenuModal() {
            document.getElementById('menuModal').classList.remove('hidden');
            renderMenuItems();
        }

        function closeMenuModal() {
            document.getElementById('menuModal').classList.add('hidden');
        }

        function renderMenuItems() {
            const container = document.getElementById('menuItemsContainer');
            const searchQuery = document.getElementById('menuSearchInput')?.value?.toLowerCase() || '';
            
            let html = '';
            let totalPcs = 0;
            let totalPrice = 0;

            for (const [category, items] of Object.entries(MENU_DATA)) {
                const filteredItems = items.filter(item => 
                    item.name.toLowerCase().includes(searchQuery) || 
                    item.desc.toLowerCase().includes(searchQuery)
                );

                if (filteredItems.length === 0) continue;

                html += `<div class="menu-category-header px-3 py-2 rounded-xl font-bold text-[10px] uppercase tracking-widest text-[var(--text-gold)] mb-2">${category}</div>`;

                filteredItems.forEach(item => {
                    const qty = menuCart[item.id] || 0;
                    totalPcs += qty;
                    totalPrice += qty * item.price;

                    html += `
                        <div class="flex justify-between items-center py-2.5 border-b border-[var(--border-gold)]">
                            <div class="flex-1 pr-2">
                                <p class="font-bold text-[var(--text-main)] text-xs">${item.name}</p>
                                <p class="text-[10px] text-muted-custom">${item.desc}</p>
                                <p class="text-[var(--text-gold)] font-bold text-xs mt-0.5">AED ${item.price}</p>
                            </div>
                            <div class="flex items-center gap-2 bg-[var(--bg-input)] p-1 rounded-xl border border-[var(--border-gold)]">
                                <button onclick="updateCart('${item.id}', -1)" class="w-6 h-6 bg-[var(--bg-card-hover)] rounded-lg font-bold">-</button>
                                <span class="font-bold px-1 w-6 text-center">${qty}</span>
                                <button onclick="updateCart('${item.id}', 1)" class="w-6 h-6 bg-[var(--text-gold)] text-stone-950 rounded-lg font-bold">+</button>
                            </div>
                        </div>
                    `;
                });
            }

            container.innerHTML = html || '<p class="text-center text-muted-custom py-8">No items found</p>';
            document.getElementById('modalMenuTotalSummary').innerText = `${totalPcs} items · ${totalPrice.toFixed(2)} AED`;
            document.getElementById('selectedBadgeCount').innerText = `${totalPcs} items`;
        }

        function updateCart(itemId, delta) {
            if (!menuCart[itemId]) menuCart[itemId] = 0;
            menuCart[itemId] = Math.max(0, menuCart[itemId] + delta);
            if (menuCart[itemId] === 0) delete menuCart[itemId];
            renderMenuItems();
        }

        function confirmMenuSelection() {
            closeMenuModal();
        }

        // Fonctions client
        function onRoomNumberTyped(roomNum) {
            const verifyBox = document.getElementById('guestVerificationBox');
            if (roomNum && roomNum.trim().length >= 1) {
                verifyBox.classList.remove('hidden');
            } else {
                verifyBox.classList.add('hidden');
            }
        }

        function verifierNomClient() {
            const roomNum = document.getElementById('guestRoomInput').value.trim();
            const nameInput = document.getElementById('guestNameInput').value.trim();

            if (!roomNum) { alert('⚠️ Please enter room number'); return; }
            if (!nameInput || nameInput.length < 2) { alert('⚠️ Please enter your name'); return; }

            document.getElementById('displayGuestName').innerText = nameInput;
            document.getElementById('roomInfoBox').classList.remove('hidden');
            document.getElementById('guestVerificationBox').classList.add('hidden');
            document.getElementById('btnChangeRoom').classList.remove('hidden');
        }

        function changerDeChambre() {
            document.getElementById('guestRoomInput').value = '';
            document.getElementById('guestNameInput').value = '';
            document.getElementById('roomInfoBox').classList.add('hidden');
            document.getElementById('guestVerificationBox').classList.add('hidden');
            document.getElementById('btnChangeRoom').classList.add('hidden');
        }

        // Fonction commande
        async function submitOrder(method) {
            const room = document.getElementById('guestRoomInput').value.trim();
            const guestName = document.getElementById('guestNameInput').value.trim();
            const mealType = document.getElementById('guestMealType').value;
            const instructions = document.getElementById('guestSpecialInstructions').value.trim();
            const deliveryTime = document.getElementById('deliveryTime').value;

            if (!room) { alert('⚠️ Please enter your room number'); return; }
            if (!guestName) { alert('⚠️ Please verify your name first'); return; }
            if (Object.keys(menuCart).length === 0) { alert('⚠️ Please select at least one item'); return; }

            let itemsArray = [];
            let totalAmount = 0;

            for (const [itemId, qty] of Object.entries(menuCart)) {
                const item = findMenuItem(itemId);
                if (item) {
                    itemsArray.push({ name: item.name, quantity: qty, price: item.price, total: qty * item.price });
                    totalAmount += qty * item.price;
                }
            }

            const orderData = {
                room_number: room,
                guest_name: guestName,
                meal_type: mealType,
                items: itemsArray,
                total_amount: totalAmount,
                special_instructions: instructions || 'None',
                delivery_time: deliveryTime,
                status: 'Pending',
                created_at: new Date().toISOString()
            };

            // Envoyer à Supabase
            const { data, error } = await supabaseClient
                .from('food_orders')
                .insert([orderData])
                .select();

            if (error) {
                console.error('Supabase Error:', error);
                alert('❌ Error submitting order. Please try again.');
                return;
            }

            // Envoi WhatsApp si demandé
            if (method === 'whatsapp') {
                const itemsList = itemsArray.map(i => `${i.quantity}x ${i.name} (AED ${i.total})`).join('\n');
                const message = `🛎️ NEW ROOM SERVICE ORDER\n\n🏨 Room: ${room}\n👤 Guest: ${guestName}\n🍽️ Meal: ${mealType}\n\n📋 Items:\n${itemsList}\n\n💰 Total: AED ${totalAmount}\n🕒 Delivery: ${deliveryTime}\n\n📝 Notes: ${instructions || 'None'}`;
                window.open(`https://wa.me/${SUPABASE_CONFIG.whatsappNumber}?text=${encodeURIComponent(message)}`, '_blank');
            }

            alert('✅ Order submitted successfully!');
            
            // Réinitialiser
            menuCart = {};
            document.getElementById('guestSpecialInstructions').value = '';
            renderMenuItems();
        }

        // Initialisation
        renderMenuItems();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remal Hotel - Guest Hub Staff Dashboard</title>
    
    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Fichiers locaux -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .animate-slide-in { animation: slideInRight 0.3s ease forwards; }
        
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        
        .pulse-ring { animation: pulse-ring 2s infinite; }

        .staff-tab-btn {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .staff-tab-btn.active {
            background: var(--text-gold);
            color: #1c1917;
            font-weight: 900;
            box-shadow: 0 5px 15px rgba(220, 167, 115, 0.3);
        }
        
        .staff-tab-btn:not(.active) {
            background: var(--bg-card-hover);
            color: var(--text-muted);
            border: 1px solid var(--border-gold);
        }
        
        .staff-tab-btn:not(.active):hover {
            color: var(--text-gold);
            border-color: var(--text-gold);
        }

        .service-type-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 9999px;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid;
            margin-right: 4px;
        }
    </style>
</head>
<body class="min-h-screen p-3 sm:p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- En-tête -->
        <div class="flex justify-between items-center remal-card p-4 rounded-2xl shadow-lg">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-[var(--text-gold)] text-stone-950 flex items-center justify-center text-xl">
                    <i class="fas fa-concierge-bell"></i>
                </div>
                <div>
                    <h1 class="text-lg font-serif-luxury font-bold text-[var(--text-gold)]">GUEST HUB DASHBOARD</h1>
                    <p class="text-[10px] text-muted-custom uppercase">Remal Hotel & Villas • All Services</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-[10px] text-emerald-400 font-bold flex items-center gap-1">
                    <span class="w-2 h-2 bg-emerald-400 rounded-full pulse-notification"></span>
                    LIVE
                </span>
                <button onclick="enableSoundAlerts()" class="text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/30 px-3 py-2 rounded-xl font-bold hover:bg-amber-500/40 transition">
                    🔊 Sound
                </button>
                <button onclick="toggleTheme()" class="theme-toggle-btn" title="Toggle Theme">
                    <i class="fas fa-sun text-sm" id="themeIconStaff"></i>
                </button>
                <button onclick="logoutStaff()" class="bg-red-500/20 text-red-400 border border-red-500/30 px-4 py-2 rounded-xl text-xs font-bold hover:bg-red-500/30 transition">
                    <i class="fas fa-sign-out-alt"></i> Exit
                </button>
            </div>
        </div>

        <!-- ONGLETS STAFF : 4 catégories -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
            <button onclick="switchStaffTab('front_desk')" id="staffTabFrontDesk" class="staff-tab-btn active px-4 py-3 rounded-xl text-xs font-bold whitespace-nowrap">
                🛎️ Front Desk & Guest Services
            </button>
            <button onclick="switchStaffTab('food_beverage')" id="staffTabFoodBeverage" class="staff-tab-btn px-4 py-3 rounded-xl text-xs font-bold whitespace-nowrap">
                🍽️ Food & Beverage
            </button>
            <button onclick="switchStaffTab('housekeeping')" id="staffTabHousekeeping" class="staff-tab-btn px-4 py-3 rounded-xl text-xs font-bold whitespace-nowrap">
                🧹 Housekeeping
            </button>
            <button onclick="switchStaffTab('maintenance')" id="staffTabMaintenance" class="staff-tab-btn px-4 py-3 rounded-xl text-xs font-bold whitespace-nowrap">
                🔧 Maintenance
            </button>
        </div>

        <!-- Statistiques -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="stat-card remal-card rounded-2xl p-4 text-center">
                <div class="text-3xl font-serif-luxury font-bold text-[var(--text-gold)]" id="statTotalOrders">0</div>
                <p class="text-[10px] text-muted-custom uppercase mt-1 font-bold">Total Requests</p>
            </div>
            <div class="stat-card remal-card rounded-2xl p-4 text-center">
                <div class="text-3xl font-serif-luxury font-bold text-amber-400" id="statPendingOrders">0</div>
                <p class="text-[10px] text-muted-custom uppercase mt-1 font-bold">Pending</p>
            </div>
            <div class="stat-card remal-card rounded-2xl p-4 text-center">
                <div class="text-3xl font-serif-luxury font-bold text-blue-400" id="statPreparingOrders">0</div>
                <p class="text-[10px] text-muted-custom uppercase mt-1 font-bold">In Progress</p>
            </div>
            <div class="stat-card remal-card rounded-2xl p-4 text-center">
                <div class="text-3xl font-serif-luxury font-bold text-emerald-400" id="statCompletedOrders">0</div>
                <p class="text-[10px] text-muted-custom uppercase mt-1 font-bold">Completed</p>
            </div>
        </div>

        <!-- Filtres par statut -->
        <div class="flex gap-2 overflow-x-auto scrollbar-none">
            <button onclick="filterStaffOrders('all')" id="filterAll" class="px-4 py-2 rounded-xl bg-[var(--text-gold)] text-stone-950 text-xs font-bold whitespace-nowrap">All</button>
            <button onclick="filterStaffOrders('Pending')" id="filterPending" class="px-4 py-2 rounded-xl remal-card text-muted-custom text-xs font-bold whitespace-nowrap">🕐 Pending</button>
            <button onclick="filterStaffOrders('Preparing')" id="filterPreparing" class="px-4 py-2 rounded-xl remal-card text-muted-custom text-xs font-bold whitespace-nowrap">👨‍🍳 Preparing</button>
            <button onclick="filterStaffOrders('Ready')" id="filterReady" class="px-4 py-2 rounded-xl remal-card text-muted-custom text-xs font-bold whitespace-nowrap">✅ Ready</button>
            <button onclick="filterStaffOrders('Delivered')" id="filterDelivered" class="px-4 py-2 rounded-xl remal-card text-muted-custom text-xs font-bold whitespace-nowrap">🚚 Delivered</button>
            <button onclick="filterStaffOrders('Completed')" id="filterCompleted" class="px-4 py-2 rounded-xl remal-card text-muted-custom text-xs font-bold whitespace-nowrap">✔️ Completed</button>
            <button onclick="filterStaffOrders('In Progress')" id="filterInProgress" class="px-4 py-2 rounded-xl remal-card text-muted-custom text-xs font-bold whitespace-nowrap">👨‍💼 In Progress</button>
        </div>

        <!-- Commandes et requêtes -->
        <div id="staffOrdersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/menu.js"></script>
    <script>
        // ==================== INITIALISATION ====================
        const supabaseClient = initSupabaseClient();
        let foodOrders = [];
        let guestRequests = [];
        let allRequests = [];
        let currentFilter = 'all';
        let currentStaffTab = 'front_desk';
        let realtimeChannel = null;
        let audioContext = null;
        let soundEnabled = false;

        // ==================== MAPPING DES SERVICES VERS LES ONGLETS ====================
        const SERVICE_TAB_MAPPING = {
            // Front Desk & Guest Services
            'Front Desk Inquiry': 'front_desk',
            'Luggage Assistance': 'front_desk',
            'Wake-up Call / Alarm Service': 'front_desk',
            'Late Check-out / Extension': 'front_desk',
            
            // Food & Beverage
            'Room Service / Order Food': 'food_beverage',
            'Table Reservation': 'food_beverage',
            
            // Housekeeping
            'Housekeeping / Room Cleaning': 'housekeeping',
            
            // Maintenance
            'Maintenance / Technical Support': 'maintenance'
        };

        // ==================== FONCTIONS THÈME ====================
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            const icon = document.getElementById('themeIconStaff');
            if (icon) icon.className = isLight ? 'fas fa-moon text-sm' : 'fas fa-sun text-sm';
            localStorage.setItem('remal_theme', isLight ? 'light' : 'dark');
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('remal_theme');
            if (savedTheme === 'light') document.body.classList.add('light-mode');
            else document.body.classList.remove('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            const icon = document.getElementById('themeIconStaff');
            if (icon) icon.className = isLight ? 'fas fa-moon text-sm' : 'fas fa-sun text-sm';
        }

        // ==================== NOTIFICATION SONORE ====================
        function enableSoundAlerts() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioContext.resume().then(() => {
                    soundEnabled = true;
                    playNotificationSound();
                    showToast('🔊 Sound alerts enabled', 'success');
                });
            } catch (e) {}
        }

        function playNotificationSound() {
            if (!soundEnabled || !audioContext) return;
            try {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioContext.currentTime);
                osc.frequency.setValueAtTime(880, audioContext.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start();
                osc.stop(audioContext.currentTime + 0.5);
            } catch (e) {}
        }

        // ==================== NOTIFICATION TOAST ====================
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
            toast.innerHTML = `<span>${icon}</span><span class="text-xs font-bold text-[var(--text-main)]">${message}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ==================== RÉCUPÉRATION DES DONNÉES ====================
        async function fetchAllData() {
            const { data: foodData } = await supabaseClient
                .from('food_orders')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(100);

            const { data: requestData } = await supabaseClient
                .from('guest_requests')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(100);

            if (foodData) {
                const newFoodOrders = foodData.filter(o => 
                    o.status === 'Pending' && 
                    !foodOrders.some(existing => existing.id === o.id)
                );
                if (newFoodOrders.length > 0) {
                    playNotificationSound();
                    showToast(`🔔 ${newFoodOrders.length} new food order(s)!`, 'info');
                }
                foodOrders = foodData;
            }

            if (requestData) {
                const newRequests = requestData.filter(r => 
                    r.status === 'Pending' && 
                    !guestRequests.some(existing => existing.id === r.id)
                );
                if (newRequests.length > 0) {
                    playNotificationSound();
                    showToast(`🔔 ${newRequests.length} new service request(s)!`, 'info');
                }
                guestRequests = requestData;
            }

            // Fusionner avec le mapping des onglets
            allRequests = [
                ...foodOrders.map(o => ({ 
                    ...o, 
                    requestType: 'food', 
                    serviceLabel: o.service_type || 'Room Service / Order Food',
                    tabCategory: 'food_beverage'
                })),
                ...guestRequests.map(r => ({ 
                    ...r, 
                    requestType: 'other', 
                    serviceLabel: r.service_type || 'Guest Request',
                    tabCategory: SERVICE_TAB_MAPPING[r.service_type] || 'front_desk'
                }))
            ].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            renderStaffOrders();
        }

        // ==================== TEMPS RÉEL ====================
        function setupRealtime() {
            if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
            
            realtimeChannel = supabaseClient
                .channel('guest-hub-realtime-staff')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'food_orders' }, () => {
                    fetchAllData();
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'guest_requests' }, () => {
                    fetchAllData();
                })
                .subscribe();
        }

        // ==================== ONGLETS STAFF ====================
        function switchStaffTab(tab) {
            currentStaffTab = tab;
            
            const tabs = ['front_desk', 'food_beverage', 'housekeeping', 'maintenance'];
            tabs.forEach(t => {
                const btn = document.getElementById(`staffTab${t.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('')}`);
                if (btn) {
                    if (t === tab) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                }
            });
            
            renderStaffOrders();
        }

        // ==================== AFFICHAGE ====================
        function renderStaffOrders() {
            const container = document.getElementById('staffOrdersContainer');
            
            // Filtrer selon l'onglet sélectionné
            let filteredRequests = allRequests.filter(r => r.tabCategory === currentStaffTab);
            
            // Filtrer selon le statut
            if (currentFilter !== 'all') {
                filteredRequests = filteredRequests.filter(r => r.status === currentFilter);
            }

            // Statistiques (sur l'onglet actuel)
            const tabRequests = allRequests.filter(r => r.tabCategory === currentStaffTab);
            document.getElementById('statTotalOrders').innerText = tabRequests.length;
            document.getElementById('statPendingOrders').innerText = tabRequests.filter(o => o.status === 'Pending').length;
            document.getElementById('statPreparingOrders').innerText = tabRequests.filter(o => o.status === 'Preparing' || o.status === 'In Progress' || o.status === 'Ready').length;
            document.getElementById('statCompletedOrders').innerText = tabRequests.filter(o => o.status === 'Delivered' || o.status === 'Completed').length;

            if (filteredRequests.length === 0) {
                container.innerHTML = '<p class="text-center text-muted-custom col-span-full py-8">No requests found</p>';
                return;
            }

            container.innerHTML = filteredRequests.map(request => {
                const isFood = request.requestType === 'food';
                const statusColors = {
                    'Pending': 'bg-amber-500/20 text-amber-400 border-amber-500/30',
                    'Preparing': 'bg-blue-500/20 text-blue-400 border-blue-500/30',
                    'In Progress': 'bg-blue-500/20 text-blue-400 border-blue-500/30',
                    'Ready': 'bg-purple-500/20 text-purple-400 border-purple-500/30',
                    'Delivered': 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30',
                    'Completed': 'bg-green-500/20 text-green-400 border-green-500/30'
                };
                const statusColor = statusColors[request.status] || statusColors['Pending'];
                const timeAgo = getTimeAgo(request.created_at);
                const isPending = request.status === 'Pending';
                
                const serviceTypeBadge = isFood 
                    ? '<span class="service-type-badge bg-orange-500/15 text-orange-400 border-orange-500/30">🍽️ Room Service</span>'
                    : `<span class="service-type-badge bg-blue-500/15 text-blue-400 border-blue-500/30">${request.serviceLabel}</span>`;

                if (isFood) {
                    const items = Array.isArray(request.items) ? request.items : [];
                    return `
                        <div class="order-card remal-card rounded-2xl p-4 space-y-3 ${isPending ? 'pulse-ring' : ''}">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="font-bold text-[var(--text-gold)] text-sm">Room ${request.room_number}</p>
                                    <p class="text-[10px] text-muted-custom uppercase">${request.guest_name}</p>
                                </div>
                                <span class="status-badge ${statusColor}">${request.status || 'Pending'}</span>
                            </div>
                            
                            ${serviceTypeBadge}
                            
                            <div class="space-y-1.5 text-xs">
                                ${items.map(item => `
                                    <div class="flex justify-between items-start border-b border-[var(--border-gold)] pb-1.5">
                                        <div>
                                            <p class="font-bold text-[var(--text-main)]">${item.quantity}x ${item.name}</p>
                                            ${item.prepTime ? `<p class="text-[9px] text-muted-custom">⏱️ ${item.prepTime}</p>` : ''}
                                            ${item.allergens && item.allergens.length > 0 ? `<p class="text-[8px] text-red-400">⚠️ ${item.allergens.join(', ')}</p>` : ''}
                                        </div>
                                        <span class="font-bold text-[var(--text-gold)]">AED ${item.total || item.price * item.quantity}</span>
                                    </div>
                                `).join('')}
                            </div>
                            
                            <div class="flex justify-between items-center text-xs border-t border-[var(--border-gold)] pt-2">
                                <span class="font-bold text-[var(--text-gold)]">Total: AED ${request.total_amount || request.subtotal || 0}</span>
                                <span class="text-[10px] text-muted-custom">${timeAgo}</span>
                            </div>
                            
                            ${request.details && request.details !== 'None' ? `
                                <div class="bg-amber-500/10 border border-amber-500/20 p-2.5 rounded-xl">
                                    <p class="text-[10px] font-bold text-amber-400">📝 Notes:</p>
                                    <p class="text-[10px] text-amber-300">${request.details}</p>
                                </div>
                            ` : ''}
                            
                            ${request.meal_type ? `<p class="text-[9px] text-muted-custom">🍽️ ${request.meal_type} • 🕒 ${request.delivery_time || 'ASAP'}</p>` : ''}
                            
                            <div class="flex gap-2 pt-1">
                                ${request.status === 'Pending' ? 
                                    `<button onclick="updateFoodOrderStatus(${request.id}, 'Preparing')" class="flex-1 bg-blue-500/20 text-blue-400 py-2.5 rounded-xl text-xs font-bold hover:bg-blue-500/40 transition">👨‍🍳 Start Preparing</button>` :
                                    request.status === 'Preparing' ?
                                    `<button onclick="updateFoodOrderStatus(${request.id}, 'Ready')" class="flex-1 bg-purple-500/20 text-purple-400 py-2.5 rounded-xl text-xs font-bold hover:bg-purple-500/40 transition">✅ Mark Ready</button>` :
                                    request.status === 'Ready' ?
                                    `<button onclick="updateFoodOrderStatus(${request.id}, 'Delivered')" class="flex-1 bg-emerald-500/20 text-emerald-400 py-2.5 rounded-xl text-xs font-bold hover:bg-emerald-500/40 transition">🚚 Mark Delivered</button>` :
                                    `<span class="flex-1 text-center text-[10px] text-emerald-400 font-bold py-2.5">✅ Completed</span>`
                                }
                                <button onclick="deleteFoodOrder(${request.id})" class="bg-red-500/10 text-red-400 px-3 py-2.5 rounded-xl text-xs font-bold hover:bg-red-500/30 transition">🗑️</button>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="order-card remal-card rounded-2xl p-4 space-y-3 ${isPending ? 'pulse-ring' : ''}">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="font-bold text-[var(--text-gold)] text-sm">Room ${request.room_number}</p>
                                    <p class="text-[10px] text-muted-custom uppercase">${request.guest_name}</p>
                                </div>
                                <span class="status-badge ${statusColor}">${request.status || 'Pending'}</span>
                            </div>
                            
                            ${serviceTypeBadge}
                            
                            <p class="text-xs font-bold text-[var(--text-main)]">${request.serviceLabel}</p>
                            
                            ${request.details ? `
                                <div class="bg-[var(--bg-dark)] p-3 rounded-xl text-[10px] text-muted-custom whitespace-pre-line">
                                    ${request.details}
                                </div>
                            ` : ''}
                            
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-[10px] text-muted-custom">${timeAgo}</span>
                            </div>
                            
                            <div class="flex gap-2 pt-1">
                                ${request.status === 'Pending' ? 
                                    `<button onclick="updateGuestRequestStatus(${request.id}, 'In Progress')" class="flex-1 bg-blue-500/20 text-blue-400 py-2.5 rounded-xl text-xs font-bold hover:bg-blue-500/40 transition">👨‍💼 Start Handling</button>` :
                                    request.status === 'In Progress' ?
                                    `<button onclick="updateGuestRequestStatus(${request.id}, 'Completed')" class="flex-1 bg-emerald-500/20 text-emerald-400 py-2.5 rounded-xl text-xs font-bold hover:bg-emerald-500/40 transition">✔️ Mark Completed</button>` :
                                    `<span class="flex-1 text-center text-[10px] text-emerald-400 font-bold py-2.5">✅ Completed</span>`
                                }
                                <button onclick="deleteGuestRequest(${request.id})" class="bg-red-500/10 text-red-400 px-3 py-2.5 rounded-xl text-xs font-bold hover:bg-red-500/30 transition">🗑️</button>
                            </div>
                        </div>
                    `;
                }
            }).join('');
        }

        // ==================== FILTRES ====================
        function filterStaffOrders(filter) {
            currentFilter = filter;
            
            const filters = ['all', 'Pending', 'Preparing', 'Ready', 'Delivered', 'Completed', 'In Progress'];
            filters.forEach(f => {
                const btn = document.getElementById(`filter${f.charAt(0).toUpperCase() + f.slice(1).replace(' ', '')}`);
                if (btn) {
                    if (f === filter) {
                        btn.className = 'px-4 py-2 rounded-xl bg-[var(--text-gold)] text-stone-950 text-xs font-bold whitespace-nowrap transition';
                    } else {
                        btn.className = 'px-4 py-2 rounded-xl remal-card text-muted-custom text-xs font-bold whitespace-nowrap transition';
                    }
                }
            });
            
            renderStaffOrders();
        }

        // ==================== MISE À JOUR DES STATUTS ====================
        async function updateFoodOrderStatus(orderId, newStatus) {
            const { error } = await supabaseClient
                .from('food_orders')
                .update({ status: newStatus })
                .eq('id', orderId);
            if (!error) {
                showToast(`Order #${orderId} → ${newStatus}`, 'success');
                fetchAllData();
            }
        }

        async function updateGuestRequestStatus(requestId, newStatus) {
            const { error } = await supabaseClient
                .from('guest_requests')
                .update({ status: newStatus })
                .eq('id', requestId);
            if (!error) {
                showToast(`Request #${requestId} → ${newStatus}`, 'success');
                fetchAllData();
            }
        }

        // ==================== SUPPRESSION ====================
        async function deleteFoodOrder(orderId) {
            if (!confirm('Delete this food order?')) return;
            const { error } = await supabaseClient.from('food_orders').delete().eq('id', orderId);
            if (!error) { showToast('Order deleted', 'info'); fetchAllData(); }
        }

        async function deleteGuestRequest(requestId) {
            if (!confirm('Delete this request?')) return;
            const { error } = await supabaseClient.from('guest_requests').delete().eq('id', requestId);
            if (!error) { showToast('Request deleted', 'info'); fetchAllData(); }
        }

        // ==================== TEMPS ÉCOULÉ ====================
        function getTimeAgo(timestamp) {
            const now = new Date();
            const then = new Date(timestamp);
            const diffMins = Math.floor((now - then) / 60000);
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins} min ago`;
            const diffHours = Math.floor(diffMins / 60);
            if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
            const diffDays = Math.floor(diffHours / 24);
            return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;
        }

        // ==================== DÉCONNEXION ====================
        function logoutStaff() {
            sessionStorage.removeItem('staff_authorized');
            sessionStorage.removeItem('staff_login_time');
            if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
            window.location.href = 'staff-login.html';
        }

        // ==================== VÉRIFICATION DE SESSION ====================
        document.addEventListener('DOMContentLoaded', () => {
            const isAuthorized = sessionStorage.getItem('staff_authorized');
            if (!isAuthorized) {
                window.location.href = 'staff-login.html';
                return;
            }
            
            const loginTime = sessionStorage.getItem('staff_login_time');
            if (loginTime) {
                const elapsed = Date.now() - new Date(loginTime).getTime();
                const maxDuration = 8 * 60 * 60 * 1000;
                if (elapsed > maxDuration) {
                    sessionStorage.removeItem('staff_authorized');
                    sessionStorage.removeItem('staff_login_time');
                    window.location.href = 'staff-login.html';
                    return;
                }
            }
            
            initTheme();
            fetchAllData();
            setupRealtime();
        });
    </script>
</body>
</html>

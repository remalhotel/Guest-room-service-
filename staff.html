<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remal Hotel - Guest Hub Staff Dashboard</title>
    
    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Fichiers locaux -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        @keyframes slideInRight { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        .animate-slide-in { animation: slideInRight 0.3s ease forwards; }
        
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .pulse-ring { animation: pulse-ring 2s infinite; }
        
        @keyframes shake-alert {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-3px); }
            20%, 40%, 60%, 80% { transform: translateX(3px); }
        }
        .shake-alert { animation: shake-alert 0.5s ease; }
        
        .staff-tab-btn { transition: all 0.3s ease; cursor: pointer; }
        .staff-tab-btn.active { background: var(--text-gold); color: #1c1917; font-weight: 900; box-shadow: 0 5px 15px rgba(220, 167, 115, 0.3); }
        .staff-tab-btn:not(.active) { background: var(--bg-card-hover); color: var(--text-muted); border: 1px solid var(--border-gold); }
        .staff-tab-btn:not(.active):hover { color: var(--text-gold); border-color: var(--text-gold); }
        
        .service-type-badge { display: inline-block; padding: 3px 10px; border-radius: 9999px; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid; margin-right: 4px; }
        
        .tab-notification-badge {
            display: inline-block;
            background: #ef4444;
            color: white;
            font-size: 8px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 9999px;
            margin-left: 4px;
            animation: pulse-ring 1.5s infinite;
        }
        
        .notification-popup {
            position: fixed;
            top: 70px;
            right: 20px;
            z-index: 200;
            background: var(--bg-card);
            border: 2px solid #ef4444;
            border-radius: 16px;
            padding: 15px 20px;
            box-shadow: 0 10px 40px rgba(239, 68, 68, 0.5);
            animation: slideInRight 0.5s ease forwards;
            max-width: 350px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .notification-popup .icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ef4444;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            animation: pulse-ring 1s infinite;
        }
        
        .sound-toggle-btn { transition: all 0.3s ease; }
        .sound-toggle-btn.active { background: #10b981; color: white; border-color: #10b981; }
        
        /* Section Impression */
        #printTicketSection { display: none; }
        
        @media print {
            body * { visibility: hidden !important; }
            #printTicketSection, #printTicketSection * { visibility: visible !important; }
            #printTicketSection {
                display: block !important;
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                padding: 20px !important;
                box-sizing: border-box !important;
                background: #ffffff !important;
                color: #000000 !important;
            }
        }
        
        /* Statistiques supplémentaires */
        .mini-stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 1rem;
            padding: 0.75rem;
            text-align: center;
        }
    </style>
</head>
<body class="min-h-screen p-3 sm:p-6">

    <div id="printTicketSection"></div>

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- En-tête -->
        <div class="flex justify-between items-center remal-card p-4 rounded-2xl shadow-lg">
            <div class="flex items-center gap-3">

        <!-- ONGLETS STAFF -->

        <!-- SECTION OFFRES -->

                        <div id="uploadZone" class="upload-zone" onclick="document.getElementById('offerImageInput').click()" style="border:2px dashed var(--border-gold-strong);border-radius:1rem;padding:2rem;text-align:center;cursor:pointer;">

                <button onclick="publishOffer()" class="w-full bg-[#DCA773] hover:bg-[#ebd0b3] text-stone-950 font-black py-4 rounded-2xl text-xs uppercase tracking-widest transition-all shadow-lg hover:scale-[1.01]">
                    <i class="fas fa-rocket mr-2"></i> Publish Offer

            <div class="remal-card rounded-2xl p-6 space-y-4">

        <!-- SECTION REQUÊTES -->

                <div class="stat-card remal-card rounded-2xl p-4 text-center">

                <div class="stat-card remal-card rounded-2xl p-4 text-center">
                    <div class="text-3xl font-serif-luxury font-bold text-blue-400" id="statPreparingOrders">0</div>
                    <p class="text-[10px] text-muted-custom uppercase mt-1 font-bold">In Progress</p>

                <div class="stat-card remal-card rounded-2xl p-4 text-center">

            <!-- STATISTIQUES SUPPLÉMENTAIRES F&B -->
            <div id="foodBeverageStats" class="hidden grid grid-cols-2 md:grid-cols-4 gap-3">
                <div class="mini-stat-card">
                    <div class="text-lg font-serif-luxury font-bold text-[var(--text-gold)]" id="fbStatTotalOrders">0</div>
                    <p class="text-[8px] text-muted-custom uppercase font-bold">F&B Orders</p>
                </div>
                <div class="mini-stat-card">
                    <div class="text-lg font-serif-luxury font-bold text-green-400" id="fbStatRevenue">AED 0</div>

            <!-- Filtres -->

                <button onclick="filterStaffOrders('Completed')" id="filterCompleted" class="px-4 py-2 rounded-xl remal-card text-muted-custom text-xs font-bold whitespace-nowrap">✔️ Completed</button>
                <button onclick="filterStaffOrders('In Progress')" id="filterInProgress" class="px-4 py-2 rounded-xl remal-card text-muted-custom text-xs font-bold whitespace-nowrap">👨‍💼 In Progress</button>

            <!-- Commandes -->
            <div id="staffOrdersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/menu.js"></script>
    <script>
        // ==================== INITIALISATION ====================
        const supabaseClient = initSupabaseClient();
        let foodOrders = [];
        let guestRequests = [];
        let allRequests = [];
        let currentFilter = 'all';
        let currentStaffTab = 'front_desk';
        let realtimeChannel = null;
        let audioContext = null;
        let soundEnabled = false;

        // ==================== HEURE DE L'APPAREIL ====================
        function updateDateTimeDisplay() {
            const now = new Date();
            const options = { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: false 
            };
            const dateTimeStr = now.toLocaleString(undefined, options);
            const displayEl = document.getElementById('currentDateTimeDisplay');
            if (displayEl) {
                displayEl.innerText = '🕒 ' + dateTimeStr;
            }
        }
        
        setInterval(updateDateTimeDisplay, 1000);
        updateDateTimeDisplay();

        // ==================== MAPPING DES SERVICES ====================
        const SERVICE_TAB_MAPPING = {
            'Front Desk Inquiry': 'front_desk',
            'Luggage Assistance': 'front_desk',
            'Wake-up Call / Alarm Service': 'front_desk',
            'Late Check-out / Extension': 'front_desk',
            'Room Service / Order Food': 'food_beverage',
            'Table Reservation': 'food_beverage',
            'Housekeeping / Room Cleaning': 'housekeeping',
            'Maintenance / Technical Support': 'maintenance'
        };

        // ==================== NOTIFICATION SONORE ====================
        function enableSoundAlerts() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioContext.resume().then(() => {
                    soundEnabled = true;
                    playNotificationSound();
                    showNotificationPopup('🔊 Sound alerts enabled!');
                    const btn = document.getElementById('btnSoundToggle');
                    if (btn) {
                        btn.className = 'sound-toggle-btn active text-[10px] px-3 py-2 rounded-xl font-bold transition';
                        btn.innerText = '🔊 Sound ON';
                    }
                });
            } catch (e) {
                console.error('Audio Error:', e);
            }
        }

        function playNotificationSound() {
            if (!soundEnabled || !audioContext) return;
            try {
                const osc1 = audioContext.createOscillator();
                const gain1 = audioContext.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(880, audioContext.currentTime);
                osc1.frequency.setValueAtTime(1100, audioContext.currentTime + 0.1);
                gain1.gain.setValueAtTime(0.4, audioContext.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.6);
                osc1.connect(gain1);
                gain1.connect(audioContext.destination);
                osc1.start();
                osc1.stop(audioContext.currentTime + 0.6);
                
                setTimeout(() => {
                    const osc2 = audioContext.createOscillator();
                    const gain2 = audioContext.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(880, audioContext.currentTime);
                    gain2.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                    osc2.connect(gain2);
                    gain2.connect(audioContext.destination);
                    osc2.start();
                    osc2.stop(audioContext.currentTime + 0.4);
                }, 300);
            } catch (e) {}
        }

        // ==================== NOTIFICATION POPUP ====================
        function showNotificationPopup(message) {
            const popup = document.createElement('div');
            popup.className = 'notification-popup';
            popup.innerHTML = `
                <div class="icon"><i class="fas fa-bell"></i></div>
                <div>
                    <p class="text-xs font-bold text-[var(--text-main)]">${message}</p>
                    <p class="text-[9px] text-muted-custom">${new Date().toLocaleTimeString()}</p>
                </div>
            `;
            document.body.appendChild(popup);
            popup.classList.add('shake-alert');
            setTimeout(() => {
                popup.style.opacity = '0';
                popup.style.transition = 'opacity 0.5s ease';
                setTimeout(() => popup.remove(), 500);
            }, 5000);
        }

        // ==================== MISE À JOUR DES BADGES ====================
        function updateTabBadges() {
            const tabs = ['front_desk', 'food_beverage', 'housekeeping', 'maintenance'];
            tabs.forEach(tab => {
                const pendingCount = allRequests.filter(r => 
                    r.tabCategory === tab && (r.status === 'Pending' || !r.status)
                ).length;
                const badge = document.getElementById(`badge${tab.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('')}`);
                if (badge) {
                    if (pendingCount > 0) {
                        badge.innerText = pendingCount;
                        badge.classList.remove('hidden');
                    } else {
                        badge.classList.add('hidden');
                    }
                }
            });
        }

        // ==================== STATISTIQUES F&B ====================
        function updateFoodBeverageStats() {
            const fbOrders = allRequests.filter(r => r.tabCategory === 'food_beverage' && r.requestType === 'food');
            const statsContainer = document.getElementById('foodBeverageStats');
            
            if (currentStaffTab === 'food_beverage') {
                statsContainer.classList.remove('hidden');
            } else {
                statsContainer.classList.add('hidden');
                return;
            }
            
            const totalOrders = fbOrders.length;
            const totalRevenue = fbOrders.reduce((sum, o) => sum + (parseFloat(o.total_amount) || 0), 0);
            const avgOrder = totalOrders > 0 ? totalRevenue / totalOrders : 0;
            
            // Trouver l'article le plus commandé
            const itemCounts = {};
            fbOrders.forEach(order => {
                const items = Array.isArray(order.items) ? order.items : [];
                items.forEach(item => {
                    const itemName = item.name || 'Unknown';
                    const qty = item.quantity || 1;
                    itemCounts[itemName] = (itemCounts[itemName] || 0) + qty;
                });
            });
            
            let topItem = '---';
            let topCount = 0;
            for (const [name, count] of Object.entries(itemCounts)) {
                if (count > topCount) {
                    topCount = count;
                    topItem = name;
                }
            }
            
            document.getElementById('fbStatTotalOrders').innerText = totalOrders;
            document.getElementById('fbStatRevenue').innerText = 'AED ' + totalRevenue.toFixed(2);
            document.getElementById('fbStatAvgOrder').innerText = 'AED ' + avgOrder.toFixed(2);
            document.getElementById('fbStatTopItem').innerText = topItem.length > 15 ? topItem.substring(0, 15) + '...' : topItem;
        }

        // ==================== IMPRESSION TICKET ====================
        function printFoodOrderTicket(orderId) {
            const order = allRequests.find(r => r.id == orderId && r.requestType === 'food');
            if (!order) return;
            
            const items = Array.isArray(order.items) ? order.items : [];
            const now = new Date();
            const dateStr = now.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
            const timeStr = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
            
            const printSection = document.getElementById('printTicketSection');
            
            printSection.innerHTML = `
                <div style="font-family: 'Courier New', monospace; max-width: 320px; margin: 0 auto; border: 2px dashed #333; padding: 20px; background: #fff; color: #000;">
                    <div style="text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px;">
                        <h2 style="margin: 0; font-size: 18px; font-weight: bold; letter-spacing: 2px;">REMAL HOTEL</h2>
                        <p style="margin: 2px 0; font-size: 10px;">Al Dhannah City</p>
                        <p style="margin: 2px 0; font-size: 10px; font-weight: bold;">ROOM SERVICE TICKET</p>
                    </div>
                    
                    <div style="margin-bottom: 10px; font-size: 11px;">
                        <div style="display: flex; justify-content: space-between;">
                            <span>Ticket #:</span><span style="font-weight: bold;">${order.id}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span>Date:</span><span>${dateStr} ${timeStr}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span>Room:</span><span style="font-weight: bold;">${order.room_number || 'N/A'}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span>Guest:</span><span>${order.guest_name || 'Guest'}</span>
                        </div>
                    </div>
                    
                    <div style="border-top: 1px dashed #333; border-bottom: 1px dashed #333; padding: 10px 0; margin-bottom: 10px; font-size: 11px;">
                        ${items.map(item => `
                            <div style="display: flex; justify-content: space-between; margin: 3px 0;">
                                <span>${item.quantity}x ${item.name}</span>
                                <span>AED ${(item.total || item.price * item.quantity || 0).toFixed(2)}</span>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div style="font-size: 12px; font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span>TOTAL:</span>
                        <span>AED ${(parseFloat(order.total_amount) || 0).toFixed(2)}</span>
                    </div>
                    
                    ${order.details && order.details !== 'None' ? `
                        <div style="font-size: 10px; background: #f5f5f5; padding: 8px; border-radius: 4px; margin-bottom: 10px;">
                            <strong>Notes:</strong> ${order.details}
                        </div>
                    ` : ''}
                    
                    <div style="text-align: center; font-size: 9px; border-top: 1px solid #333; padding-top: 10px; margin-top: 10px;">
                        <p style="margin: 0;">Merci de votre visite !</p>
                        <p style="margin: 2px 0;">Remal Hotel & Villas</p>
                    </div>
                </div>
            `;
            
            setTimeout(() => {
                window.print();
            }, 300);
        }

        // ==================== TÉLÉCHARGEMENT TICKET ====================
        function downloadFoodOrderTicket(orderId) {
            const order = allRequests.find(r => r.id == orderId && r.requestType === 'food');
            if (!order) return;
            
            const items = Array.isArray(order.items) ? order.items : [];
            const now = new Date();
            const dateStr = now.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
            const timeStr = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
            
            let ticketText = '═══════════════════════════════════════\n';
            ticketText += '         REMAL HOTEL & VILLAS\n';
            ticketText += '         Al Dhannah City\n';
            ticketText += '       ROOM SERVICE TICKET\n';
            ticketText += '═══════════════════════════════════════\n\n';
            ticketText += 'Ticket #: ' + order.id + '\n';
            ticketText += 'Date: ' + dateStr + ' ' + timeStr + '\n';
            ticketText += 'Room: ' + (order.room_number || 'N/A') + '\n';
            ticketText += 'Guest: ' + (order.guest_name || 'Guest') + '\n';
            ticketText += '\n───────────────────────────────────────\n';
            ticketText += 'ITEMS:\n';
            ticketText += '───────────────────────────────────────\n';
            
            items.forEach(item => {
                const line = `${item.quantity}x ${item.name}`;
                const price = `AED ${(item.total || item.price * item.quantity || 0).toFixed(2)}`;
                const dots = '.'.repeat(Math.max(1, 40 - line.length - price.length));
                ticketText += line + dots + price + '\n';
            });
            
            ticketText += '───────────────────────────────────────\n';
            ticketText += 'TOTAL: AED ' + (parseFloat(order.total_amount) || 0).toFixed(2) + '\n';
            ticketText += '═══════════════════════════════════════\n';
            
            if (order.details && order.details !== 'None') {
                ticketText += 'Notes: ' + order.details + '\n';
            }
            
            ticketText += 'Merci de votre visite !\n';
            ticketText += 'Remal Hotel & Villas\n';
            
            const blob = new Blob([ticketText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Remal_Ticket_${order.room_number}_${order.id}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ==================== RÉCUPÉRATION DES DONNÉES ====================
        async function fetchAllData() {
            const { data: foodData } = await supabaseClient
                .from('food_orders')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(100);

            const { data: requestData } = await supabaseClient
                .from('guest_requests')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(100);

            if (foodData) {
                const newFoodOrders = foodData.filter(o => 
                    o.status === 'Pending' && 
                    !foodOrders.some(existing => existing.id === o.id)
                );
                if (newFoodOrders.length > 0) {
                    playNotificationSound();
                    showNotificationPopup(`🔔 ${newFoodOrders.length} new food order(s) received!`);
                }
                foodOrders = foodData;
            }

            if (requestData) {
                const newRequests = requestData.filter(r => 
                    r.status === 'Pending' && 
                    !guestRequests.some(existing => existing.id === r.id)
                );
                if (newRequests.length > 0) {
                    playNotificationSound();
                    showNotificationPopup(`🔔 ${newRequests.length} new service request(s)!`);
                }
                guestRequests = requestData;
            }

            allRequests = [
                ...foodOrders.map(o => ({ ...o, requestType: 'food', serviceLabel: o.service_type || 'Room Service / Order Food', tabCategory: 'food_beverage' })),
                ...guestRequests.map(r => ({ ...r, requestType: 'other', serviceLabel: r.service_type || 'Guest Request', tabCategory: SERVICE_TAB_MAPPING[r.service_type] || 'front_desk' }))
            ].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            updateTabBadges();
            updateFoodBeverageStats();
            renderStaffOrders();
        }

        // ==================== TEMPS RÉEL ====================
        function setupRealtime() {
            if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
            
            realtimeChannel = supabaseClient
                .channel('guest-hub-realtime-staff')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'food_orders' }, (payload) => {
                    if (payload.eventType === 'INSERT') {
                        playNotificationSound();
                        showNotificationPopup('🔔 New food order received!');
                    }
                    fetchAllData();
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'guest_requests' }, (payload) => {
                    if (payload.eventType === 'INSERT') {
                        playNotificationSound();
                        showNotificationPopup('🔔 New service request received!');
                    }
                    fetchAllData();
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'offers' }, () => {
                    fetchOffers();
                })
                .subscribe();
        }

        // ==================== ONGLETS ====================
        function switchStaffTab(tab) {
            currentStaffTab = tab;
            
            const tabs = ['front_desk', 'food_beverage', 'housekeeping', 'maintenance', 'offers'];
            tabs.forEach(t => {
                const btn = document.getElementById(`staffTab${t.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('')}`);
                if (btn) {
                    if (t === tab) { btn.classList.add('active'); } else { btn.classList.remove('active'); }
                }
            });
            
            if (tab === 'offers') {
                document.getElementById('offersManagementSection').classList.remove('hidden');
                document.getElementById('requestsSection').classList.add('hidden');
                document.getElementById('foodBeverageStats').classList.add('hidden');
                fetchOffers();
            } else {
                document.getElementById('offersManagementSection').classList.add('hidden');
                document.getElementById('requestsSection').classList.remove('hidden');
                updateFoodBeverageStats();
                renderStaffOrders();
            }
        }

        // ==================== AFFICHAGE DES REQUÊTES ====================
        function renderStaffOrders() {
            const container = document.getElementById('staffOrdersContainer');
            
            let filteredRequests = allRequests.filter(r => r.tabCategory === currentStaffTab);
            if (currentFilter !== 'all') {
                filteredRequests = filteredRequests.filter(r => r.status === currentFilter);
            }

            const tabRequests = allRequests.filter(r => r.tabCategory === currentStaffTab);
            document.getElementById('statTotalOrders').innerText = tabRequests.length;
            document.getElementById('statPendingOrders').innerText = tabRequests.filter(o => o.status === 'Pending').length;
            document.getElementById('statPreparingOrders').innerText = tabRequests.filter(o => o.status === 'Preparing' || o.status === 'In Progress' || o.status === 'Ready').length;
            document.getElementById('statCompletedOrders').innerText = tabRequests.filter(o => o.status === 'Delivered' || o.status === 'Completed').length;

            if (filteredRequests.length === 0) {
                container.innerHTML = '<p class="text-center text-muted-custom col-span-full py-8">No requests found</p>';
                return;
            }

            container.innerHTML = filteredRequests.map(request => {
                const isFood = request.requestType === 'food';
                const statusColors = {
                    'Pending': 'bg-amber-500/20 text-amber-400 border-amber-500/30',
                    'Preparing': 'bg-blue-500/20 text-blue-400 border-blue-500/30',
                    'In Progress': 'bg-blue-500/20 text-blue-400 border-blue-500/30',
                    'Ready': 'bg-purple-500/20 text-purple-400 border-purple-500/30',
                    'Delivered': 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30',
                    'Completed': 'bg-green-500/20 text-green-400 border-green-500/30'
                };
                const statusColor = statusColors[request.status] || statusColors['Pending'];
                const timeAgo = getTimeAgo(request.created_at);
                const isPending = request.status === 'Pending';
                
                const serviceTypeBadge = isFood 
                    ? '<span class="service-type-badge bg-orange-500/15 text-orange-400 border-orange-500/30">🍽️ Room Service</span>'
                    : `<span class="service-type-badge bg-blue-500/15 text-blue-400 border-blue-500/30">${request.serviceLabel}</span>`;

                if (isFood) {
                    const items = Array.isArray(request.items) ? request.items : [];
                    return `
                        <div class="order-card remal-card rounded-2xl p-4 space-y-3 ${isPending ? 'pulse-ring' : ''}">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="font-bold text-[var(--text-gold)] text-sm">Room ${request.room_number}</p>
                                    <p class="text-[10px] text-muted-custom uppercase">${request.guest_name}</p>
                                </div>
                                <span class="status-badge ${statusColor}">${request.status || 'Pending'}</span>
                            </div>
                            ${serviceTypeBadge}
                            <div class="space-y-1.5 text-xs">
                                ${items.map(item => `
                                    <div class="flex justify-between items-start border-b border-[var(--border-gold)] pb-1.5">
                                        <div>
                                            <p class="font-bold text-[var(--text-main)]">${item.quantity}x ${item.name}</p>
                                            ${item.prepTime ? `<p class="text-[9px] text-muted-custom">⏱️ ${item.prepTime}</p>` : ''}
                                        </div>
                                        <span class="font-bold text-[var(--text-gold)]">AED ${item.total || item.price * item.quantity}</span>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="flex justify-between items-center text-xs border-t border-[var(--border-gold)] pt-2">
                                <span class="font-bold text-[var(--text-gold)]">Total: AED ${request.total_amount || 0}</span>
                                <span class="text-[10px] text-muted-custom">${timeAgo}</span>
                            </div>
                            ${request.details && request.details !== 'None' ? `
                                <div class="bg-amber-500/10 border border-amber-500/20 p-2.5 rounded-xl">
                                    <p class="text-[10px] font-bold text-amber-400">📝 Notes:</p>
                                    <p class="text-[10px] text-amber-300">${request.details}</p>
                                </div>
                            ` : ''}
                            <div class="flex gap-2 pt-1">
                                ${request.status === 'Pending' ? 
                                    `<button onclick="updateFoodOrderStatus(${request.id}, 'Preparing')" class="flex-1 bg-blue-500/20 text-blue-400 py-2.5 rounded-xl text-xs font-bold hover:bg-blue-500/40 transition">👨‍🍳 Start Preparing</button>` :
                                    request.status === 'Preparing' ?
                                    `<button onclick="updateFoodOrderStatus(${request.id}, 'Ready')" class="flex-1 bg-purple-500/20 text-purple-400 py-2.5 rounded-xl text-xs font-bold hover:bg-purple-500/40 transition">✅ Mark Ready</button>` :
                                    request.status === 'Ready' ?
                                    `<button onclick="updateFoodOrderStatus(${request.id}, 'Delivered')" class="flex-1 bg-emerald-500/20 text-emerald-400 py-2.5 rounded-xl text-xs font-bold hover:bg-emerald-500/40 transition">🚚 Mark Delivered</button>` :
                                    `<span class="flex-1 text-center text-[10px] text-emerald-400 font-bold py-2.5">✅ Completed</span>`
                                }
                            </div>
                            <!-- Boutons Impression et Téléchargement -->
                            <div class="flex gap-2 pt-1">
                                <button onclick="printFoodOrderTicket(${request.id})" class="flex-1 bg-stone-800 text-stone-200 py-2 rounded-xl text-[10px] font-bold hover:bg-stone-700 transition">
                                    🖨️ Print
                                </button>
                                <button onclick="downloadFoodOrderTicket(${request.id})" class="flex-1 bg-stone-800 text-stone-200 py-2 rounded-xl text-[10px] font-bold hover:bg-stone-700 transition">
                                    ⬇️ Download
                                </button>
                                <button onclick="deleteFoodOrder(${request.id})" class="bg-red-500/10 text-red-400 px-3 py-2 rounded-xl text-xs font-bold hover:bg-red-500/30 transition">🗑️</button>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="order-card remal-card rounded-2xl p-4 space-y-3 ${isPending ? 'pulse-ring' : ''}">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="font-bold text-[var(--text-gold)] text-sm">Room ${request.room_number}</p>
                                    <p class="text-[10px] text-muted-custom uppercase">${request.guest_name}</p>
                                </div>
                                <span class="status-badge ${statusColor}">${request.status || 'Pending'}</span>
                            </div>
                            ${serviceTypeBadge}
                            <p class="text-xs font-bold text-[var(--text-main)]">${request.serviceLabel}</p>
                            ${request.details ? `
                                <div class="bg-[var(--bg-dark)] p-3 rounded-xl text-[10px] text-muted-custom whitespace-pre-line">
                                    ${request.details}
                                </div>
                            ` : ''}
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-[10px] text-muted-custom">${timeAgo}</span>
                            </div>
                            <div class="flex gap-2 pt-1">
                                ${request.status === 'Pending' ? 
                                    `<button onclick="updateGuestRequestStatus(${request.id}, 'In Progress')" class="flex-1 bg-blue-500/20 text-blue-400 py-2.5 rounded-xl text-xs font-bold hover:bg-blue-500/40 transition">👨‍💼 Start Handling</button>` :
                                    request.status === 'In Progress' ?
                                    `<button onclick="updateGuestRequestStatus(${request.id}, 'Completed')" class="flex-1 bg-emerald-500/20 text-emerald-400 py-2.5 rounded-xl text-xs font-bold hover:bg-emerald-500/40 transition">✔️ Mark Completed</button>` :
                                    `<span class="flex-1 text-center text-[10px] text-emerald-400 font-bold py-2.5">✅ Completed</span>`
                                }
                                <button onclick="deleteGuestRequest(${request.id})" class="bg-red-500/10 text-red-400 px-3 py-2.5 rounded-xl text-xs font-bold hover:bg-red-500/30 transition">🗑️</button>
                            </div>
                        </div>
                    `;
                }
            }).join('');
            
            updateFoodBeverageStats();
        }

        // ==================== FILTRES ====================
        function filterStaffOrders(filter) {
            currentFilter = filter;
            renderStaffOrders();
        }

        // ==================== MISE À JOUR DES STATUTS ====================
        async function updateFoodOrderStatus(orderId, newStatus) {
            const { error } = await supabaseClient.from('food_orders').update({ status: newStatus }).eq('id', orderId);
            if (!error) { showToast(`Order #${orderId} → ${newStatus}`, 'success'); fetchAllData(); }
        }

        async function updateGuestRequestStatus(requestId, newStatus) {
            const { error } = await supabaseClient.from('guest_requests').update({ status: newStatus }).eq('id', requestId);
            if (!error) { showToast(`Request #${requestId} → ${newStatus}`, 'success'); fetchAllData(); }
        }

        // ==================== SUPPRESSION ====================
        async function deleteFoodOrder(orderId) {
            if (!confirm('Delete this food order?')) return;
            const { error } = await supabaseClient.from('food_orders').delete().eq('id', orderId);
            if (!error) { showToast('Order deleted', 'info'); fetchAllData(); }
        }

        async function deleteGuestRequest(requestId) {
            if (!confirm('Delete this request?')) return;
            const { error } = await supabaseClient.from('guest_requests').delete().eq('id', requestId);
            if (!error) { showToast('Request deleted', 'info'); fetchAllData(); }
        }

        // ==================== OFFRES ====================
        function handleOfferImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) { showToast('Image too large. Max 5MB.', 'error'); return; }
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('offerImagePreview');
                const placeholder = document.getElementById('uploadPlaceholder');
                preview.src = e.target.result;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
                window.selectedOfferImage = e.target.result;
                showToast('Image selected!', 'success');
            };
            reader.readAsDataURL(file);
        }

        async function publishOffer() {
            const title = document.getElementById('offerTitle').value.trim();
            const price = document.getElementById('offerPrice').value.trim();
            const description = document.getElementById('offerDescription').value.trim();
            const category = document.getElementById('offerCategory').value;
            
            if (!title) { showToast('Please enter a title', 'error'); return; }
            if (!price) { showToast('Please enter a price', 'error'); return; }
            if (!description) { showToast('Please enter a description', 'error'); return; }
            if (!window.selectedOfferImage) { showToast('Please select an image', 'error'); return; }
            
            const offerData = { title, price, description, category, image: window.selectedOfferImage, is_active: true, created_at: new Date().toISOString() };
            const { error } = await supabaseClient.from('offers').insert([offerData]);
            if (error) { showToast('Error publishing offer', 'error'); return; }
            showToast('✅ Offer published successfully!', 'success');
            document.getElementById('offerTitle').value = '';
            document.getElementById('offerPrice').value = '';
            document.getElementById('offerDescription').value = '';
            document.getElementById('offerCategory').value = 'Pool & Beach';
            window.selectedOfferImage = null;
            document.getElementById('offerImagePreview').classList.add('hidden');
            document.getElementById('uploadPlaceholder').classList.remove('hidden');
            fetchOffers();
        }

        async function fetchOffers() {
            const { data } = await supabaseClient.from('offers').select('*').order('created_at', { ascending: false }).limit(20);
            if (data) renderOffersList(data);
        }

        function renderOffersList(offers) {
            const container = document.getElementById('offersListContainer');
            if (!offers || !offers.length) {
                container.innerHTML = '<p class="text-center text-muted-custom col-span-full py-8">No offers published yet</p>';
                return;
            }
            container.innerHTML = offers.map(offer => `
                <div class="order-card remal-card rounded-2xl overflow-hidden">
                    <img src="${offer.image}" alt="${offer.title}" class="w-full h-40 object-cover" onerror="this.src='logo.png'">
                    <div class="p-4 space-y-2">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="font-bold text-[var(--text-gold)] text-xs">${offer.title}</p>
                                <p class="text-[9px] text-muted-custom">${offer.category}</p>
                            </div>
                            <span class="font-bold text-[var(--text-gold)] text-sm">${offer.price}</span>
                        </div>
                        <p class="text-[10px] text-muted-custom">${offer.description}</p>
                        <div class="flex gap-2 pt-2">
                            <button onclick="toggleOfferActive(${offer.id}, ${!offer.is_active})" class="flex-1 ${offer.is_active ? 'bg-emerald-500/20 text-emerald-400' : 'bg-gray-500/20 text-gray-400'} py-2 rounded-xl text-xs font-bold transition">
                                ${offer.is_active ? '✅ Active' : '❌ Inactive'}
                            </button>
                            <button onclick="deleteOffer(${offer.id})" class="bg-red-500/10 text-red-400 px-3 py-2 rounded-xl text-xs font-bold hover:bg-red-500/30 transition">🗑️</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function toggleOfferActive(offerId, isActive) {
            const { error } = await supabaseClient.from('offers').update({ is_active: isActive }).eq('id', offerId);
            if (!error) { showToast(`Offer ${isActive ? 'activated' : 'deactivated'}`, 'success'); fetchOffers(); }
        }

        async function deleteOffer(offerId) {
            if (!confirm('Delete this offer?')) return;
            const { error } = await supabaseClient.from('offers').delete().eq('id', offerId);
            if (!error) { showToast('Offer deleted', 'info'); fetchOffers(); }
        }

        // ==================== THÈME ====================
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            const icon = document.getElementById('themeIconStaff');
            if (icon) icon.className = isLight ? 'fas fa-moon text-sm' : 'fas fa-sun text-sm';
            localStorage.setItem('remal_theme', isLight ? 'light' : 'dark');
        }

        function initTheme() {
            const saved = localStorage.getItem('remal_theme');
            if (saved === 'light') document.body.classList.add('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            const icon = document.getElementById('themeIconStaff');
            if (icon) icon.className = isLight ? 'fas fa-moon text-sm' : 'fas fa-sun text-sm';
        }

        function showToast(msg, type = 'info') { const t = document.createElement('div'); t.className = 'toast-notification toast-in'; t.innerHTML = `<span>${type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️'}</span><span class="text-xs font-bold">${msg}</span>`; document.body.appendChild(t); setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000); }

        // ==================== TEMPS ÉCOULÉ ====================
        function getTimeAgo(timestamp) {
            const now = new Date();
            const then = new Date(timestamp);
            const diffMins = Math.floor((now - then) / 60000);
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins} min ago`;
            const diffHours = Math.floor(diffMins / 60);
            if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
            const diffDays = Math.floor(diffHours / 24);
            return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;
        }

        // ==================== DÉCONNEXION ====================
        function logoutStaff() {
            sessionStorage.removeItem('staff_authorized');
            sessionStorage.removeItem('staff_login_time');
            if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
            window.location.href = 'staff-login.html';
        }

        // ==================== VÉRIFICATION DE SESSION ====================
        document.addEventListener('DOMContentLoaded', () => {
            const isAuthorized = sessionStorage.getItem('staff_authorized');
            if (!isAuthorized) {
                window.location.href = 'staff-login.html';
                return;
            }
            
            const loginTime = sessionStorage.getItem('staff_login_time');
            if (loginTime) {
                const elapsed = Date.now() - new Date(loginTime).getTime();
                const maxDuration = 8 * 60 * 60 * 1000;
                if (elapsed > maxDuration) {
                    sessionStorage.removeItem('staff_authorized');
                    sessionStorage.removeItem('staff_login_time');
                    window.location.href = 'staff-login.html';
                    return;
                }
            }
            
            initTheme();
            updateDateTimeDisplay();
            fetchAllData();
            fetchOffers();
            setupRealtime();
        });
    </script>
</body>
</html>
